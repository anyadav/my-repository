name: Daily LinkedIn Job Scrape

on:
  schedule:
    # 23:00 UTC = 04:30 IST next day, every day
    - cron: "0 23 * * *"
  workflow_dispatch: {}
  # NOTE: 'push' trigger removed — v1 re-ran the full scrape (wiping the
  # Airtable table) on every commit to the branch. Use the manual
  # "Run workflow" button when you want an on-demand run.

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude-job-agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install python-jobspy requests

      - name: Run scraper
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_ID: ${{ secrets.AIRTABLE_TABLE_ID }}
        run: python scrape_jobs.py

      - name: Score jobs against resume (local — no LLM, no API key)
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_ID: ${{ secrets.AIRTABLE_TABLE_ID }}
        run: python score_jobs.py

# GEMINI_API_KEY is no longer used anywhere in this pipeline.
# The 429 quota-exhaustion failure mode is structurally eliminated.
